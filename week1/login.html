<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FBS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>FBS E-Books</h1>
    <p>World's Best Online Books Website</p>
  </header>

  <nav>
    <a href="home.html">Home</a>
    <a href="registration.html">Registration</a>
    <a href="login.html">Login</a>
    <a href="catalog.html">Catalog</a>
    <a href="cart.html">Cart</a>
  </nav>

  <main class="form-box">
    <h2 class="center">User Login</h2>
    <form>
      <label>Username:</label>
      <input type="text" name="username" placeholder="Enter username" required>
      <label>Password:</label>
      <input type="password" name="password" placeholder="Enter password" required>
      <br><br>
      <input class="button" type="submit" value="Login">
      <input class="reset-button" type="reset" value="Reset">
    </form>
    <p class="center">New user? <a href="registration.html">Register here</a></p>
  </main>
  <footer>
    <p>© 2026 FBS E-Books. All Rights Reserved.</p>
  </footer>
</body>
</html>
