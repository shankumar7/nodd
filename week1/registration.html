<!DOCTYPE html>
<html lang="en">
<head>
  <title>Registration - FBS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>FBS E-Books</h1>
    <p>World's Best Online Books Website</p>
  </header>

  <nav>
    <a href="home.html">Home</a>
    <a href="registration.html">Registration</a>
    <a href="login.html">Login</a>
    <a href="catalog.html">Catalog</a>
    <a href="cart.html">Cart</a>
  </nav>

  <main class="form-box">
    <h2 class="center">Registration Form</h2>
    <form>
      <label>Name:</label>
      <input type="text" name="username" placeholder="Enter your name" required>
      <label>Password:</label>
      <input type="password" name="password" placeholder="Enter password" required>
      <label>Email ID:</label>
      <input type="email" name="email" placeholder="Enter email" required>
      <label>Gender:</label>
      <input type="radio" name="gender" value="Male"> Male
      <input type="radio" name="gender" value="Female"> Female
      <label>Languages Known:</label>
      <input type="checkbox" name="language" value="English"> English
      <input type="checkbox" name="language" value="Telugu"> Telugu
      <input type="checkbox" name="language" value="Hindi"> Hindi
      <label>Address:</label>
      <textarea name="address" rows="3" placeholder="Enter address"></textarea>
      <br><br>
      <input class="button" type="submit" value="Register">
      <input class="reset-button" type="reset" value="Reset">
    </form>
  </main>
  <footer>
    <p>© 2026 FBS E-Books. All Rights Reserved.</p>
  </footer>
</body>
</html>
