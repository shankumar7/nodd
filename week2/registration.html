<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration - FBS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bg-primary text-white text-center p-3">
    <h1>FBS E-Books</h1>
    <p>World's Best Online Books Website</p>
  </header>

  <nav class="navbar navbar-expand bg-dark justify-content-center">
    <a class="nav-link text-white mx-3" href="home.html">Home</a>
    <a class="nav-link text-white mx-3" href="registration.html">Registration</a>
    <a class="nav-link text-white mx-3" href="login.html">Login</a>
    <a class="nav-link text-white mx-3" href="catalog.html">Catalog</a>
    <a class="nav-link text-white mx-3" href="cart.html">Cart</a>
  </nav>

  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h2 class="text-center">Registration Form</h2>
        <form>
          <label class="form-label">Name:</label>
          <input type="text" class="form-control mb-3" placeholder="Enter your name" required>
          <label class="form-label">Password:</label>
          <input type="password" class="form-control mb-3" placeholder="Enter password" required>
          <label class="form-label">Email ID:</label>
          <input type="email" class="form-control mb-3" placeholder="Enter email" required>
          <label>Gender:</label>
          <br>
          <input type="radio" name="gender" class="form-check-input"> Male
          <input type="radio" name="gender" class="form-check-input ms-2"> Female
          <br><br>
          <label>Languages Known:</label>
          <br>
          <input type="checkbox" class="form-check-input"> English
          <input type="checkbox" class="form-check-input ms-2"> Telugu
          <input type="checkbox" class="form-check-input ms-2"> Hindi
          <br><br>
          <label class="form-label">Address:</label>
          <textarea class="form-control mb-3" rows="3"></textarea>
          <button type="submit" class="btn btn-primary">Register</button>
          <button type="reset" class="btn btn-secondary">Reset</button>
        </form>
      </div>
    </div>
  </div>
  <footer class="bg-primary text-white text-center p-3 mt-4">
    © 2026 FBS E-Books. All Rights Reserved.
  </footer>
</body>
</html>
