<!DOCTYPE html>
<html lang="en">
<head>
  <title>Cart - FBS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bg-primary text-white text-center p-3">
    <h1>FBS E-Books</h1>
    <p>World's Best Online Books Website</p>
  </header>

  <nav class="navbar navbar-expand bg-dark justify-content-center">
    <a class="nav-link text-white mx-3" href="home.html">Home</a>
    <a class="nav-link text-white mx-3" href="registration.html">Registration</a>
    <a class="nav-link text-white mx-3" href="login.html">Login</a>
    <a class="nav-link text-white mx-3" href="catalog.html">Catalog</a>
    <a class="nav-link text-white mx-3" href="cart.html">Cart</a>
  </nav>

  <div class="container mt-4">
    <h2 class="text-center">Shopping Cart</h2>
    <div class="table-responsive">
      <table class="table table-bordered text-center">
        <tr class="table-primary">
          <th>Book Name</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Amount</th>
        </tr>
        <tr>
          <td>Java Programming</td>
          <td>₹500</td>
          <td>1</td>
          <td>₹500</td>
        </tr>
        <tr>
          <td>Python Programming</td>
          <td>₹400</td>
          <td>2</td>
          <td>₹800</td>
        </tr>
        <tr>
          <th colspan="3">Total Amount</th>
          <th>₹1300</th>
        </tr>
      </table>
    </div>
    <div class="text-center">
      <a href="catalog.html" class="btn btn-primary">Continue Shopping</a>
      <button class="btn btn-success">Checkout</button>
    </div>
  </div>
  <footer class="bg-primary text-white text-center p-3 mt-4">
    © 2026 FBS E-Books. All Rights Reserved.
  </footer>
</body>
</html>
